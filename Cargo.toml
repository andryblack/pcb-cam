[workspace]
members = ["crates/pcb-cam", "crates/pcb-cam-core", "crates/pcb-cam-engine"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["andryblack <blackicebox@gmail.com>"]
description = "Cross-platform CAM workbench for Gerber and Excellon PCB files"

[workspace.dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.28"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
gerber_parser = "0.5.0"
pcb-cam-core = { path = "crates/pcb-cam-core" }
pcb-cam-engine = { path = "crates/pcb-cam-engine" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
