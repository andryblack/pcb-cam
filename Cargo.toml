[workspace]
members = ["crates/pbc-cam", "crates/pbc-cam-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["andryblack <blackicebox@gmail.com>"]
description = "Cross-platform CAM workbench for Gerber and Excellon PCB files"

[workspace.dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.28"
pbc-cam-core = { path = "crates/pbc-cam-core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
