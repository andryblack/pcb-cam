# Configuration for `cargo about generate`.
#
# Priority order matters: when a crate offers several licenses (for example
# `MIT OR Apache-2.0`), cargo-about picks the first accepted one. Only
# permissive licenses are accepted here; GPL/LGPL alternatives are never used.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
